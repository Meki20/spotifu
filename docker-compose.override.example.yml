# Optional LAN override. Copy to `docker-compose.override.yml` and adjust.
#
# This is the default bridge-network setup with one change: advertise the
# server's LAN IP so cover/stream URLs work for remote clients.
#
# Replace 192.168.1.100 with this host's LAN IP.

services:
  server:
    environment:
      API_BASE_URL: http://192.168.1.100:1985
      MDNS_ENABLED: "true"
