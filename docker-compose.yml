services:
  postgres:
    image: postgres:16-alpine
    container_name: spotifu-postgres
    environment:
      POSTGRES_USER: spotifu
      POSTGRES_PASSWORD: spotifu
      POSTGRES_DB: spotifu
    volumes:
      - spotifu-db:/var/lib/postgresql/data
    # Loopback-only publish so host tools (`psql`, ad-hoc inspection) work
    # without crossing networks or exposing Postgres on the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotifu"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: spotifu-server
    user: "1000:1000"
    environment:
      DATABASE_URL: postgresql://spotifu:spotifu@postgres:5432/spotifu
      CACHE_DIR: /data/spotifu/cache
      API_BASE_URL: ${API_BASE_URL:-http://localhost:1985}
      SOULSEEK_USERNAME: ${SOULSEEK_USERNAME:-}
      SOULSEEK_PASSWORD: ${SOULSEEK_PASSWORD:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      FANARTTV_API_KEY: ${FANARTTV_API_KEY:-}
      SECRETS_FILE: /app/.secrets
      MDNS_ENABLED: ${MDNS_ENABLED:-false}
      MDNS_HOSTNAME: ${MDNS_HOSTNAME:-spotifu}
      MDNS_PORT: ${MDNS_PORT:-1985}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    volumes:
      - ./.secrets:/app/.secrets
      - spotifu-cache:/data/spotifu/cache
    ports:
      - "1985:1985"
    healthcheck:
      # Real readiness: parse JSON body, exit 1 unless `ready: true`.
      # `start_period` covers Soulseek login which can be slow on first boot.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request, json, sys;
          r = urllib.request.urlopen('http://127.0.0.1:1985/health/ready', timeout=4);
          body = json.loads(r.read());
          sys.exit(0 if body.get('ready') is True else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  spotifu-db:
  spotifu-cache:
